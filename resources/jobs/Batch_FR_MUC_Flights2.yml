resources:
  jobs:
    Batch_FR_MUC_Flights:
      name: Batch_FR_MUC_Flights2
      schedule:
        quartz_cron_expression: 7 37 4 * * ?
        timezone_id: Europe/Berlin
        pause_status: UNPAUSED
      tasks:
        - task_key: Batch_all_depatures_FR_MUC
          spark_python_task:
            python_file: ../../src/Extract_Data/getterResource.py
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
