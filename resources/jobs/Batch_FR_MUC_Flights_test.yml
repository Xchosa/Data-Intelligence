resources:
  jobs:
    Batch_FR_MUC_Flights:
      name: Batch_FR_MUC_Flights2
      schedule:
        quartz_cron_expression: 27 1 0/4 * * ?
        timezone_id: Europe/Berlin
        pause_status: UNPAUSED
      tasks:
        - task_key: Batch_all_depatures_FR_MUC
          spark_python_task:
            python_file: ../../src/extract_data/getterDepartures.py
          environment_key: Default
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED


