resources:
  jobs:
    get_Reference_data:
      name: get_Reference_data
      # email_notifications: 
      #   on_failure:
      #   paul.overbeck95@gmail.com
      schedule:
        quartz_cron_expression: 49 45 23 * * ?
        timezone_id: Europe/Berlin
        pause_status: UNPAUSED
      tasks:
        - task_key: get_Reference_data_python
          spark_python_task:
            python_file: ../../src/extract_data/getterResource.py

          environment_key: Default
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED


