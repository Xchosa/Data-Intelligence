resources:
  jobs:
    get_Reference_data:
      name: get_Reference_data
      schedule:
        quartz_cron_expression: 49 45 23 * * ?
        timezone_id: Europe/Berlin
        pause_status: UNPAUSED
      tasks:
        - task_key: get_Reference_data_python
          spark_python_task:
            python_file: ../../src/Extract_Data/getterDepartures.py
          environment_key: Default
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED
