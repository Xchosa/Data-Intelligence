# This is a Databricks asset bundle definition for Lufthansa_Data.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: Lufthansa_Data
  uuid: f44a81d2-9f12-4e22-84e3-815e8a969566

include:
  - resources/*.yml
  - resources/*/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-1f1ceac5-9ef0.cloud.databricks.com
    variables:
      catalog: lufthansa_data
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-1f1ceac5-9ef0.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/paul.overbeck95@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/paul.overbeck95@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: lufthansa_data
      schema: prod
    permissions:
      - user_name: paul.overbeck95@gmail.com
        level: CAN_MANAGE
